<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Docs</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="header">
    <h1>Auto Docs</h1>
    <p>Internal Case Generator Tool</p>
  </div>

  <!-- TOGGLE -->
  <div class="toggle-row">
    <span class="toggle-label">Compact Mode</span>
    <input type="checkbox" id="compactMode">
  </div>

  <!-- CASE SECTION -->
  <div class="card">
    <h2>Case Information</h2>

    <div class="field">
      <label>CASE</label>
      <input id="case" placeholder="00000000">
    </div>

    <div class="field">
      <label>DETAILS OF THE CONCERN</label>
      <textarea id="details"></textarea>
    </div>
  </div>

  <!-- CUSTOMER SECTION -->
  <div class="card">
    <h2>Customer Details</h2>

    <div class="grid">
      <div class="field">
        <label>NAME</label>
        <input id="name">
      </div>

      <div class="field">
        <label>MIN</label>
        <input id="min">
      </div>

      <div class="field">
        <label>COMPANY</label>
        <input id="company">
      </div>

      <div class="field">
        <label>EMAIL</label>
        <input id="email">
      </div>
    </div>

    <div class="field">
      <label>THREAD CASE NUMBER</label>
      <input id="thread">
    </div>

    <div class="field">
      <label>DATE & TIME RECEIVED</label>
      <input id="datetime">
    </div>
  </div>

  <!-- ACTION SECTION -->
  <div class="card">
    <h2>Resolution</h2>

    <div class="field">
      <label>ACTION TAKEN</label>
      <textarea id="action"></textarea>
    </div>

    <div class="field">
      <label>WOCAS</label>
      <textarea id="wocas"></textarea>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="buttons">
    <button onclick="generateDoc()">Generate</button>
    <button onclick="copyDoc()">Copy</button>
    <button onclick="downloadTxt()">Download TXT</button>
  </div>

  <pre id="output"></pre>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
