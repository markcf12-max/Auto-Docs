<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Docs</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>Auto Docs</h1>

  <!-- Compact Mode -->
  <div class="toggle-row">
    <span class="toggle-label">Compact Mode</span>

    <label class="switch">
      <input type="checkbox" id="compactMode">
      <span class="slider"></span>
    </label>
  </div>

  <div class="field">
    <label>CASE</label>
    <input id="case">
  </div>

  <div class="field">
    <label>DETAILS OF THE CONCERN</label>
    <textarea id="details"></textarea>
  </div>

  <div class="field">
    <label>NAME</label>
    <input id="name">
  </div>

  <div class="field">
    <label>MIN</label>
    <input id="min">
  </div>

  <div class="field">
    <label>COMPANY NAME</label>
    <input id="company">
  </div>

  <div class="field">
    <label>EMAIL ADDRESS</label>
    <input id="email">
  </div>

  <div class="field">
    <label>THREAD CASE NUMBER</label>
    <input id="thread">
  </div>

  <div class="field">
    <label>DATE & TIME EMAIL RECEIVED</label>
    <input id="datetime">
  </div>

  <div class="field">
    <label>ACTION TAKEN</label>
    <textarea id="action"></textarea>
  </div>

  <div class="field">
    <label>WOCAS</label>
    <textarea id="wocas"></textarea>
  </div>

  <div class="buttons">
    <button onclick="generateDoc()">Generate</button>
    <button onclick="copyDoc()">Copy</button>
    <button onclick="downloadTxt()">Download TXT</button>
    <button onclick="clearForm()">Clear</button>
  </div>

  <pre id="output"></pre>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
