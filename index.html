<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Docs</title>
  <link rel="stylesheet" href="style.css">
  <!-- Added an icon library for the theme toggle button -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div class="app">

  <!-- TOP BAR WITH THEME TOGGLE -->
  <div class="topbar">
    <div>
      <h1>Auto Docs</h1>
      <p>Case Generator System</p>
    </div>
    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
      <i class="fas fa-moon"></i>
    </button>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="layout">

    <!-- INPUT PANEL -->
    <div class="panel inputPanel">

      <div class="group">
        <div class="label">SR/CASE</div>
        <input id="case" placeholder="00000000">
      </div>

      <div class="grid">

        <div class="group">
          <div class="label">CONCERN TYPE</div>
          <select id="concernType">
            <option value="Technical">Technical</option>
            <option value="Aftersales">Aftersales</option>
            <option value="Inquiry">Inquiry</option>
            <option value="Complaint">Complaint</option>
          </select>
        </div>

        <div class="group">
          <div class="label">VOC</div>
          <!-- Click triggers focus auto-select -->
          <input type="text" id="voc" list="vocOptions" placeholder="Type keywords (e.g. sim, billing)..." autocomplete="off" onfocus="this.select()">
          <datalist id="vocOptions"></datalist>
        </div>

      </div>

      <div class="group">
        <div class="label">DETAILS OF THE CONCERN</div>
        <textarea id="details"></textarea>
      </div>

      <div class="grid">
        <div class="group">
          <div class="label">NAME</div>
          <input id="name">
        </div>

        <div class="group">
          <div class="label">MIN</div>
          <input id="min">
        </div>
      </div>

      <div class="group">
        <div class="label">COMPANY NAME</div>
        <input id="company">
      </div>

      <div class="grid">
        <div class="group">
          <div class="label">EMAIL ADDRESS</div>
          <input id="email">
        </div>

        <div class="group">
          <div class="label">THREAD NUMBER</div>
          <input id="thread">
        </div>
      </div>

      <div class="group">
        <div class="label">DATE & TIME RECEIVED</div>
        <input id="datetime">
      </div>

      <div class="group">
        <div class="label">ACTION TAKEN</div>
        <textarea id="action"></textarea>
      </div>

      <div class="group">
        <div class="label">WOCAS</div>
        <textarea id="wocas"></textarea>
      </div>

      <div class="buttons">
        <button onclick="copyDoc()">Copy</button>
        <button onclick="downloadTxt()">Download</button>
        <button onclick="resetForm()">Reset</button>
      </div>

    </div>

    <!-- OUTPUT PANEL -->
    <div class="panel outputPanel">
      <div class="outputHeader">Generated Output</div>
      <pre id="output"></pre>
    </div>

    <!-- SUGGESTION PANEL -->
    <div class="panel suggestionPanel">
      <div class="outputHeader">Suggested Procedures</div>
      <div id="suggestions">Select Concern & VOC</div>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
