<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Docs Generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="topbar">
    <h1>Auto Docs</h1>
    <p>Case Generator System</p>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="layout">

    <!-- LEFT INPUT PANEL -->
    <div class="panel">

      <div class="grid-2">
        <div class="group">
          <label>CASE</label>
          <input id="case" placeholder="00000000">
        </div>

        <div class="group">
          <label>DATE & TIME</label>
          <input id="datetime">
        </div>
      </div>

      <div class="group">
        <label>DETAILS OF THE CONCERN</label>
        <textarea id="details"></textarea>
      </div>

      <div class="grid-2">
        <div class="group">
          <label>NAME</label>
          <input id="name">
        </div>

        <div class="group">
          <label>MIN</label>
          <input id="min">
        </div>
      </div>

      <div class="group">
        <label>COMPANY NAME</label>
        <input id="company">
      </div>

      <div class="grid-2">
        <div class="group">
          <label>EMAIL</label>
          <input id="email">
        </div>

        <div class="group">
          <label>THREAD CASE</label>
          <input id="thread">
        </div>
      </div>

      <div class="group">
        <label>ACTION TAKEN</label>
        <textarea id="action"></textarea>
      </div>

      <div class="group">
        <label>WOCAS</label>
        <textarea id="wocas"></textarea>
      </div>

      <!-- BUTTONS -->
      <div class="buttons">
        <button onclick="generateDoc()">Generate</button>
        <button onclick="copyDoc()">Copy</button>
        <button onclick="downloadDoc()">Download</button>
        <button class="danger" onclick="resetForm()">Reset</button>
      </div>

    </div>

    <!-- RIGHT OUTPUT PANEL -->
    <div class="output">

      <div class="output-header">OUTPUT PREVIEW</div>
      <pre id="output"></pre>

    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
