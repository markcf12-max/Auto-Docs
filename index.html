<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Docs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input, textarea {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    textarea {
      min-height: 80px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

    pre {
      margin-top: 15px;
      background: #111827;
      color: #fff;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Auto Docs</h1>

  <!-- Compact Toggle (CSS handled in your style.css) -->
  <div class="toggle-row">
    <span class="toggle-label">Compact Mode</span>

    <label class="switch">
      <input type="checkbox" id="compactMode">
      <span class="slider"></span>
    </label>
  </div>

  <div class="field">
    <label>CASE</label>
    <input id="case">
  </div>

  <div class="field">
    <label>DETAILS OF THE CONCERN</label>
    <textarea id="details"></textarea>
  </div>

  <div class="field">
    <label>NAME</label>
    <input id="name">
  </div>

  <div class="field">
    <label>MIN</label>
    <input id="min">
  </div>

  <div class="field">
    <label>COMPANY NAME</label>
    <input id="company">
  </div>

  <div class="field">
    <label>EMAIL ADDRESS</label>
    <input id="email">
  </div>

  <div class="field">
    <label>THREAD CASE NUMBER</label>
    <input id="thread">
  </div>

  <div class="field">
    <label>DATE & TIME EMAIL RECEIVED</label>
    <input id="datetime">
  </div>

  <div class="field">
    <label>ACTION TAKEN</label>
    <textarea id="action"></textarea>
  </div>

  <div class="field">
    <label>WOCAS</label>
    <textarea id="wocas"></textarea>
  </div>

  <div class="buttons">
    <button onclick="generateDoc()">Generate</button>
    <button onclick="copyDoc()">Copy</button>
    <button onclick="downloadTxt()">Download TXT</button>
  </div>

  <pre id="output"></pre>

</div>
<script type="module" src="script.js"></script>

</body>
</html>
