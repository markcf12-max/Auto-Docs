<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Docs</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="topbar">
    <div>
      <h1>Auto Docs</h1>
      <p>Case Generator System</p>
    </div>
  </div>

  <div class="layout">

    <!-- LEFT -->
    <div class="panel">

      <div class="group">
        <div class="label">CASE</div>
        <input id="case" placeholder="00000000">
      </div>

      <div class="grid">
        <div class="group">
          <div class="label">CONCERN TYPE</div>
          <select id="concernType">
            <option value="">Select</option>
            <option>Inquiry</option>
            <option>Complaint</option>
            <option>Aftersales</option>
            <option>Other</option>
          </select>
        </div>

        <div class="group">
          <div class="label">VOC</div>
          <select id="voc">
            <option value="">Select</option>
            <option>Positive</option>
            <option>Neutral</option>
            <option>Negative</option>
          </select>
        </div>
      </div>

      <div class="group">
        <div class="label">DETAILS</div>
        <textarea id="details"></textarea>
      </div>

      <div class="grid">
        <div class="group">
          <div class="label">NAME</div>
          <input id="name">
        </div>

        <div class="group">
          <div class="label">MIN</div>
          <input id="min">
        </div>
      </div>

      <div class="group">
        <div class="label">COMPANY</div>
        <input id="company">
      </div>

      <div class="grid">
        <div class="group">
          <div class="label">EMAIL</div>
          <input id="email">
        </div>

        <div class="group">
          <div class="label">THREAD</div>
          <input id="thread">
        </div>
      </div>

      <div class="group">
        <div class="label">DATE & TIME</div>
        <input id="datetime">
      </div>

      <div class="group">
        <div class="label">ACTION TAKEN</div>
        <textarea id="action"></textarea>
      </div>

      <div class="group">
        <div class="label">WOCAS</div>
        <textarea id="wocas"></textarea>
      </div>

      <div class="buttons">
        <button onclick="generateDoc()">Generate</button>
        <button onclick="copyDoc()">Copy</button>
        <button onclick="downloadTxt()">Download</button>
        <button onclick="resetForm()">Reset</button>
      </div>

    </div>

    <!-- RIGHT -->
    <div class="outputPanel">
      <div class="outputHeader">Generated Output</div>
      <pre id="output"></pre>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
