<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Docs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input, textarea {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    textarea {
      min-height: 80px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

    pre {
      margin-top: 15px;
      background: #111827;
      color: #fff;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Auto Docs</h1>

  <label>
    <input type="checkbox" id="compactMode">
    Compact Mode
  </label>

  <input id="case" placeholder="CASE">
  <textarea id="details" placeholder="DETAILS OF THE CONCERN"></textarea>

  <input id="name" placeholder="NAME">
  <input id="min" placeholder="MIN">
  <input id="company" placeholder="COMPANY NAME">
  <input id="email" placeholder="EMAIL ADDRESS">
  <input id="thread" placeholder="THREAD CASE NUMBER">
  <input id="datetime" placeholder="DATE & TIME EMAIL RECEIVED">

  <textarea id="action" placeholder="ACTION TAKEN"></textarea>
  <textarea id="wocas" placeholder="WOCAS"></textarea>

  <div class="buttons">
    <button onclick="generateDoc()">Generate</button>
    <button onclick="copyDoc()">Copy</button>
    <button onclick="downloadTxt()">Download TXT</button>
  </div>

  <pre id="output"></pre>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
